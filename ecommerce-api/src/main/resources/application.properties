spring.application.name=ecommerce

# Puerto del servidor
server.port=8081

# Configuracion de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerceUPB
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate/JPA — update porque ecommerce ya existe pero examen-api añade tablas nuevas
# (materias, estudiantes). 'update' es aditivo: no toca columnas existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT — clave secreta en Base64 (mínimo 256 bits). Cambiar en producción.
security.jwt.token.secret-key=ZWNvbW1lcmNlU2VjcmV0S2V5MjAyNVVQQkNlcnRpZmljYWNpb24=
# Tiempo de expiración en MINUTOS (480 = 8 horas)
security.jwt.token.expire-length=480
